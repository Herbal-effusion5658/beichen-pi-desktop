name: Bug report
description: Report a reproducible non-security problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, OAuth codes, private code, full sessions, or exploit details.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.8.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: redacted
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private code, personal paths, and sensitive screenshots.
          required: true
